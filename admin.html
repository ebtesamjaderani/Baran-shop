<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت فروشگاه باران</title><link rel="stylesheet" href="style.css"></head><body><div class="admin-wrap"><div class="admin-card"><a href="index.html">← بازگشت به فروشگاه</a><h1>مدیریت محصولات</h1><div class="note">برای هر کالا می‌توانید چند عکس انتخاب کنید. عکس‌ها در مرورگر ذخیره می‌شوند؛ برای عکس‌های زیاد بهتر است بعداً فضای ذخیره‌سازی جداگانه وصل کنیم.</div><div class="form-grid"><div><label>نام کالا</label><input id="name"></div><div><label>دسته‌بندی</label><input id="cat" value="خانه و آشپزخانه"></div><div><label>قیمت فروش (تومان)</label><input id="price" inputmode="numeric"></div><div><label>قیمت قبل از تخفیف (اختیاری)</label><input id="oldPrice" inputmode="numeric"></div><div><label>موجودی</label><input id="stock" type="number" value="10"></div><div><label>برند</label><input id="brand"></div><div><label>رنگ</label><input id="color"></div><div><label>ابعاد</label><input id="dimensions"></div><div><label>جنس</label><input id="material"></div><div><label>وزن</label><input id="weight"></div></div><label>توضیحات</label><textarea id="description" style="width:100%;min-height:90px;border:1px solid #ddd;border-radius:9px;padding:10px"></textarea><label>چند عکس برای کالا انتخاب کنید</label><input id="images" type="file" accept="image/*" multiple onchange="previewImages()"><div id="preview" class="thumbs"></div><div class="admin-actions"><button class="admin-btn" onclick="addProduct()">افزودن محصول</button><button class="admin-btn secondary" onclick="clearForm()">پاک کردن فرم</button></div></div><div class="admin-card" style="margin-top:20px"><h2>محصولات ثبت‌شده</h2><div id="list" class="admin-list"></div></div></div><script>let products=JSON.parse(localStorage.getItem('baran_products')||'[]');let selectedImages=[];function readFiles(files){selectedImages=[];let ps=[...files].map(f=>new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)}));Promise.all(ps).then(a=>{selectedImages=a;previewImages()})}function previewImages(){let files=document.querySelector('#images').files;if(files.length)readFiles(files);else document.querySelector('#preview').innerHTML=selectedImages.map(x=>`<img src="${x}" style="width:70px;height:70px;object-fit:contain;background:#f5f2ef;border-radius:8px">`).join('')}function addProduct(){let name=document.querySelector('#name').value.trim(),price=document.querySelector('#price').value.trim(),stock=document.querySelector('#stock').value;if(!name||!price)return alert('نام و قیمت را وارد کنید');let p={name,cat:document.querySelector('#cat').value||'خانه و آشپزخانه',price,oldPrice:document.querySelector('#oldPrice').value,stock:Number(stock||0),brand:document.querySelector('#brand').value,color:document.querySelector('#color').value,dimensions:document.querySelector('#dimensions').value,material:document.querySelector('#material').value,weight:document.querySelector('#weight').value,description:document.querySelector('#description').value,images:selectedImages};if(p.images.length)p.image=p.images[0];products.push(p);localStorage.setItem('baran_products',JSON.stringify(products));clearForm();renderList();alert('محصول با موفقیت اضافه شد')}function clearForm(){document.querySelectorAll('input,textarea').forEach(x=>{if(x.id!=='cat'&&x.id!=='stock'&&x.type!=='file')x.value=''});document.querySelector('#cat').value='خانه و آشپزخانه';document.querySelector('#stock').value=10;document.querySelector('#images').value='';selectedImages=[];document.querySelector('#preview').innerHTML=''}function del(i){if(confirm('حذف شود؟')){products.splice(i,1);localStorage.setItem('baran_products',JSON.stringify(products));renderList()}}function renderList(){document.querySelector('#list').innerHTML=products.length?products.map((p,i)=>`<div class="admin-item"><div class="admin-item-info"><div class="admin-thumb">${p.images?.[0]?`<img src="${p.images[0]}">`:(p.emoji||'🛍️')}</div><div><b>${p.name}</b><br><small>${p.price} تومان · ${p.images?.length||0} عکس</small></div></div><button class="admin-btn danger" onclick="del(${i})">حذف</button></div>`).join(''):'هنوز محصولی ثبت نشده است'}renderList()</script></body></html>
