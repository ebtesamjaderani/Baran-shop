<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مدیریت محصولات | فروشگاه باران</title><link rel="stylesheet" href="style.css"></head><body><div class="admin-wrap"><div class="admin-card"><h1>⚙️ مدیریت محصولات فروشگاه باران</h1><div class="note">از این صفحه می‌توانید محصول اضافه، ویرایش یا حذف کنید. اطلاعات در همین مرورگر ذخیره می‌شود. برای انتشار واقعی روی اینترنت، بعداً می‌توانیم پنل آنلاین و دیتابیس هم اضافه کنیم.</div><form id="productForm"><div class="form-grid"><div><label>نام محصول</label><input id="name" required placeholder="مثلاً ماگ تدی اسموتی"></div><div><label>دسته‌بندی</label><select id="cat"><option>ابزار آشپزخانه</option><option>فلاسک و ماگ</option><option>بانکه و ظروف نگهدارنده</option><option>پلاسکو</option><option>ظروف و پذیرایی</option><option>قاشق و چنگال</option><option>کتری و دم‌نوش</option><option>سایر</option></select></div><div><label>قیمت (تومان)</label><input id="price" required placeholder="۲۸۵,۰۰۰"></div><div><label>موجودی کالا</label><input id="stock" type="number" min="0" step="1" required value="1" placeholder="۱۰"></div><div><label>عکس محصول</label><input id="image" type="file" accept="image/*"><div class="preview" id="preview">🛍️</div></div></div><div class="admin-actions"><button class="admin-btn" type="submit" id="saveBtn">➕ افزودن محصول</button><button class="admin-btn secondary" type="button" id="cancelBtn" style="display:none">انصراف از ویرایش</button><a class="admin-btn secondary" href="index.html">🏠 مشاهده فروشگاه</a></div></form><h2>محصولات ثبت‌شده</h2><div id="list" class="admin-list"></div></div></div><script>
let products=JSON.parse(localStorage.getItem('baran_products')||'null')||[];let editing=-1;let imageData='';const $=id=>document.getElementById(id);
function save(){localStorage.setItem('baran_products',JSON.stringify(products));render();}
function render(){const list=$('list');list.innerHTML=products.map((p,i)=>`<div class="admin-item"><div class="admin-item-info"><div class="admin-thumb">${p.image?`<img src="${p.image}">`:p.emoji||'🛍️'}</div><div><b>${p.name}</b><br><small>${p.cat} — ${p.price} تومان — موجودی: ${Number(p.stock ?? 0).toLocaleString('fa-IR')} عدد</small></div></div><div class="admin-actions"><button class="admin-btn" onclick="edit(${i})">✏️ ویرایش</button><button class="admin-btn danger" onclick="removeProduct(${i})">🗑️ حذف</button></div></div>`).join('')||'<p>هنوز محصولی ثبت نشده است.</p>'}
$('image').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;$('preview').innerHTML=`<img src="${imageData}">`};r.readAsDataURL(f)});
$('productForm').addEventListener('submit',e=>{e.preventDefault();const p={name:$('name').value.trim(),cat:$('cat').value,price:$('price').value.trim(),stock:Math.max(0,parseInt($('stock').value||'0',10)),image:imageData,emoji:'🛍️'};if(editing<0)products.push(p);else{if(!p.image)p.image=products[editing].image||'';products[editing]=p}save();resetForm();alert(editing<0?'محصول اضافه شد.':'محصول ویرایش شد.');});
function edit(i){editing=i;const p=products[i];$('name').value=p.name;$('cat').value=p.cat;$('price').value=p.price;$('stock').value=p.stock ?? 0;imageData=p.image||'';$('preview').innerHTML=p.image?`<img src="${p.image}">`:(p.emoji||'🛍️');$('saveBtn').textContent='💾 ذخیره تغییرات';$('cancelBtn').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})}
function removeProduct(i){if(confirm('این محصول حذف شود؟')){products.splice(i,1);save()}}
function resetForm(){editing=-1;imageData='';$('productForm').reset();$('preview').textContent='🛍️';$('saveBtn').textContent='➕ افزودن محصول';$('cancelBtn').style.display='none'}$('cancelBtn').onclick=resetForm;render();
</script></body></html>
