<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت محصولات | Baranplusss</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f5fb;color:#27233a}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 5px 20px #0001}h1{font-size:24px}label{display:block;font-weight:700;margin:10px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd6e8;border-radius:10px;font:inherit}textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#6f42c1;color:#fff}.secondary{background:#eee8f7;color:#432e62}.danger{background:#ffe5e5;color:#a00000}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{padding:11px;border-radius:10px;background:#f1ecf8;margin-top:12px;white-space:pre-wrap}.product{border:1px solid #eee5f6;border-radius:14px;padding:14px;margin-top:10px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#777;font-size:13px}.editing{border:2px solid #6f42c1}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{flex-direction:column;align-items:stretch}}</style></head>
<body><div class="wrap"><h1>مدیریت محصولات Baranplusss</h1>
<div class="card"><label>آدرس Worker / API</label><input id="api" placeholder="https://baranplusss-api.ebtesamjaderani.workers.dev"><div class="muted">آدرس Worker را بدون /api وارد کنید.</div><div class="actions"><button class="primary" onclick="testApi()">تست اتصال</button><button class="secondary" onclick="loadProducts()">بارگذاری محصولات</button></div><div id="status" class="status">آماده</div></div>
<div class="card" id="formCard"><h2 id="formTitle">افزودن محصول جدید</h2><input type="hidden" id="editId"><div class="grid">
<div class="full"><label>نام محصول *</label><input id="name"></div><div><label>دسته‌بندی</label><select id="category"><option value="">انتخاب کنید</option><option>خانه و آشپزخانه</option><option>ابزار آشپزخانه</option><option>فلاسک و ماگ</option><option>بانکه و ظروف</option><option>محصولات پلاستیکی</option><option>سایر</option></select></div><div><label>موجودی</label><input id="stock" type="number" min="0"></div><div><label>قیمت</label><input id="price" type="number" min="0"></div><div><label>قیمت قبل از تخفیف</label><input id="old_price" type="number" min="0"></div><div><label>برند</label><input id="brand"></div><div><label>رنگ</label><input id="color"></div><div><label>ابعاد</label><input id="dimensions"></div><div><label>جنس</label><input id="material"></div><div><label>وزن</label><input id="weight"></div><div class="full"><label>توضیحات</label><textarea id="description"></textarea></div><div class="full"><label>آدرس عکس‌ها</label><textarea id="images" placeholder="هر آدرس عکس را در یک خط وارد کنید"></textarea></div></div><div class="actions"><button class="primary" onclick="saveProduct()">ذخیره محصول</button><button class="secondary" onclick="resetForm()">انصراف / محصول جدید</button></div></div>
<div class="card"><h2>محصولات موجود در دیتابیس</h2><div id="products">برای دیدن محصولات روی «بارگذاری محصولات» بزنید.</div></div></div>
<script>
const $=id=>document.getElementById(id);let products=[];
function base(){let v=$('api').value.trim().replace(/\/+$/,'');v=v.replace(/\/api$/i,'');return v}
function msg(t){$('status').textContent=t}
function saveBase(){let v=base();if(v)localStorage.setItem('baranplusss_api',v);return v}
async function api(path,opt={}){const b=saveBase();if(!b)throw Error('آدرس Worker وارد نشده است.');const r=await fetch(b+path,{...opt,cache:'no-store',headers:{'Accept':'application/json','Content-Type':'application/json',...(opt.headers||{})}});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){throw Error('پاسخ API قابل خواندن نیست. HTTP '+r.status)}if(!r.ok||d.success===false)throw Error((d.message||'خطای API')+' (HTTP '+r.status+')');return d}
async function testApi(){try{const d=await api('/api/test');msg('اتصال موفق است:\n'+(d.message||'Baranplusss API is working'));}catch(e){msg('خطا در اتصال به API:\n'+e.message)}}
async function loadProducts(){ $('products').textContent='در حال بارگذاری...';try{const d=await api('/api/products');products=Array.isArray(d.products)?d.products:[];render();msg('محصولات با موفقیت از دیتابیس دریافت شدند.');}catch(e){$('products').textContent='خطا در بارگذاری محصولات:\n'+e.message;msg('خطا در بارگذاری محصولات:\n'+e.message)}}
function render(){if(!products.length){$('products').innerHTML='<div class="muted">محصولی پیدا نشد.</div>';return}$('products').innerHTML=products.map(p=>`<div class="product"><div class="head"><div><strong>${esc(p.name)}</strong><div class="muted">شناسه: ${p.id} | موجودی: ${p.stock||0} | قیمت: ${Number(p.price||0).toLocaleString('fa-IR')} تومان</div></div><div class="actions"><button class="primary" onclick="editProduct(${Number(p.id)})">ویرایش</button><button class="danger" onclick="deleteProduct(${Number(p.id)})">حذف</button></div></div></div>`).join('')}
function editProduct(id){const p=products.find(x=>Number(x.id)===id);if(!p)return;$('editId').value=p.id;$('formTitle').textContent='ویرایش محصول شماره '+p.id;for(const k of ['name','category','price','old_price','stock','brand','color','dimensions','material','weight','description'])$(k).value=p[k]??'';let im=[];try{im=JSON.parse(p.images||'[]')}catch(e){}$('images').value=Array.isArray(im)?im.join('\n'):'';$('formCard').classList.add('editing');scrollTo({top:0,behavior:'smooth'})}
function data(){return{name:$('name').value.trim(),category:$('category').value,price:Number($('price').value)||0,old_price:Number($('old_price').value)||0,stock:Number($('stock').value)||0,brand:$('brand').value.trim(),color:$('color').value.trim(),dimensions:$('dimensions').value.trim(),material:$('material').value.trim(),weight:$('weight').value.trim(),description:$('description').value.trim(),images:$('images').value.split('\n').map(x=>x.trim()).filter(Boolean)}}
async function saveProduct(){const id=$('editId').value,p=data();if(!p.name)return msg('نام محصول را وارد کنید.');try{await api(id?'/api/products/'+id:'/api/products',{method:id?'PUT':'POST',body:JSON.stringify(p)});msg(id?'محصول با موفقیت ویرایش شد.':'محصول با موفقیت اضافه شد.');resetForm();await loadProducts()}catch(e){msg('خطا در ذخیره محصول:\n'+e.message)}}
async function deleteProduct(id){const p=products.find(x=>Number(x.id)===id);if(!p||!confirm('محصول «'+p.name+'» حذف شود؟'))return;try{await api('/api/products/'+id,{method:'DELETE'});await loadProducts();msg('محصول حذف شد.')}catch(e){msg('خطا در حذف محصول:\n'+e.message)}}
function resetForm(){$('editId').value='';$('formTitle').textContent='افزودن محصول جدید';['name','price','old_price','stock','brand','color','dimensions','material','weight','description','images'].forEach(id=>$(id).value='');$('category').value='';$('formCard').classList.remove('editing')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('api').value=localStorage.getItem('baranplusss_api')||'';
</script></body></html>
