<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت محصولات | Baranplusss</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;color:#222;font-family:Tahoma,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 20px;position:sticky;top:0;z-index:10}
.wrap{max-width:1100px;margin:auto}
h1{margin:0 0 6px;font-size:22px}
.muted{color:#6b7280;font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-family:inherit;font-size:14px}
.primary{background:#6d4aff;color:#fff}.secondary{background:#e9e7ff;color:#4d35bd}.danger{background:#fee2e2;color:#b91c1c}.gray{background:#eef0f3;color:#333}
.status{padding:10px 14px;border-radius:10px;background:#eefbf2;color:#176b35;margin-bottom:15px;display:none}
.status.err{background:#fff0f0;color:#a11}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 3px 14px #00000008}
.list{max-height:70vh;overflow:auto}
.item{padding:13px;border:1px solid #eee;border-radius:12px;margin-bottom:9px;cursor:pointer;background:#fff}
.item.active{border-color:#6d4aff;background:#f7f5ff}
.item strong{display:block;margin-bottom:5px}
.item small{color:#777}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d9dde5;border-radius:10px;font-family:inherit;font-size:14px;background:#fff}
textarea{min-height:100px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.photo{position:relative;width:105px;height:105px;border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fafafa}
.photo img{width:100%;height:100%;object-fit:contain}
.photo button{position:absolute;top:4px;left:4px;width:26px;height:26px;padding:0;border-radius:50%;background:#fff;color:#b91c1c;box-shadow:0 1px 5px #0002}
.empty{color:#777;text-align:center;padding:30px 10px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.list{max-height:none}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>مدیریت محصولات Baranplusss</h1>
<div class="muted">محصولات از پایگاه داده Cloudflare D1 خوانده و ذخیره می‌شوند.</div>
</div>
</header>

<main class="wrap" style="padding:20px 0">
<div id="status" class="status"></div>

<div class="toolbar">
<button class="primary" onclick="newProduct()">＋ محصول جدید</button>
<button class="secondary" onclick="loadProducts()">↻ بروزرسانی محصولات</button>
</div>

<div class="grid">
<section class="card">
<h3 style="margin-top:0">محصولات موجود</h3>
<div id="productList" class="list"><div class="empty">در حال دریافت محصولات...</div></div>
</section>

<section class="card">
<div id="editor">
<div class="empty">یک محصول را از فهرست انتخاب کنید یا روی «محصول جدید» بزنید.</div>
</div>
</section>
</div>
</main>

<script>
const API = "https://api.baranplusss.ir";
let products = [];
let selectedId = null;
let images = [];

function showStatus(msg, error=false){
  const el=document.getElementById("status");
  el.textContent=msg;
  el.className="status"+(error?" err":"");
  el.style.display="block";
  clearTimeout(window.statusTimer);
  window.statusTimer=setTimeout(()=>el.style.display="none",4500);
}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function parseImages(v){
  if(Array.isArray(v)) return v;
  if(!v) return [];
  try{
    const x=JSON.parse(v);
    return Array.isArray(x)?x:[];
  }catch(e){return []}
}

async function loadProducts(){
  document.getElementById("productList").innerHTML='<div class="empty">در حال دریافت...</div>';
  try{
    const r=await fetch(API+"/api/products");
    const data=await r.json();
    if(!data.success) throw new Error(data.message||"خطا در دریافت محصولات");
    products=data.products||[];
    renderList();
    showStatus("محصولات با موفقیت دریافت شدند.");
  }catch(e){
    document.getElementById("productList").innerHTML='<div class="empty">خطا در دریافت محصولات</div>';
    showStatus("خطا: "+e.message,true);
  }
}

function renderList(){
  const el=document.getElementById("productList");
  if(!products.length){el.innerHTML='<div class="empty">هنوز محصولی ثبت نشده است.</div>';return}
  el.innerHTML=products.map(p=>`
    <div class="item ${selectedId===p.id?"active":""}" onclick="editProduct(${p.id})">
      <strong>${esc(p.name)}</strong>
      <small>کد ${p.id} · ${Number(p.price||0).toLocaleString("fa-IR")} تومان · موجودی ${Number(p.stock||0).toLocaleString("fa-IR")}</small>
    </div>`).join("");
}

function newProduct(){
  selectedId=null;
  images=[];
  renderEditor({
    name:"",category:"",price:0,old_price:0,stock:0,brand:"",
    color:"",dimensions:"",material:"",weight:"",description:""
  },true);
  renderList();
}

function editProduct(id){
  const p=products.find(x=>Number(x.id)===Number(id));
  if(!p)return;
  selectedId=p.id;
  images=parseImages(p.images);
  renderEditor(p,false);
  renderList();
}

function renderEditor(p,isNew){
  document.getElementById("editor").innerHTML=`
    <h2 style="margin-top:0">${isNew?"افزودن محصول جدید":"ویرایش محصول #"+esc(p.id)}</h2>

    <label>نام محصول *</label>
    <input id="f_name" value="${esc(p.name)}">

    <div class="row">
      <div><label>دسته‌بندی</label><input id="f_category" value="${esc(p.category)}"></div>
      <div><label>برند</label><input id="f_brand" value="${esc(p.brand)}"></div>
    </div>

    <div class="row">
      <div><label>قیمت</label><input id="f_price" type="number" value="${Number(p.price)||0}"></div>
      <div><label>قیمت قبلی</label><input id="f_old_price" type="number" value="${Number(p.old_price)||0}"></div>
    </div>

    <div class="row">
      <div><label>موجودی</label><input id="f_stock" type="number" value="${Number(p.stock)||0}"></div>
      <div><label>رنگ</label><input id="f_color" value="${esc(p.color)}"></div>
    </div>

    <div class="row">
      <div><label>ابعاد</label><input id="f_dimensions" value="${esc(p.dimensions)}"></div>
      <div><label>جنس</label><input id="f_material" value="${esc(p.material)}"></div>
    </div>

    <label>وزن</label>
    <input id="f_weight" value="${esc(p.weight)}">

    <label>توضیحات</label>
    <textarea id="f_description">${esc(p.description)}</textarea>

    <label>عکس‌های محصول</label>
    <input id="imageInput" type="file" accept="image/*" multiple onchange="readImages(event)">
    <div class="muted" style="margin-top:6px">می‌توانی چند عکس را از گالری/کامپیوتر انتخاب کنی. عکس‌های قبلی تا وقتی حذفشان نکنی باقی می‌مانند.</div>
    <div id="preview" class="preview"></div>

    <div class="actions">
      <button class="primary" onclick="saveProduct()">${isNew?"ذخیره محصول":"ذخیره تغییرات"}</button>
      ${!isNew?'<button class="danger" onclick="deleteProduct()">حذف محصول</button>':""}
      <button class="gray" onclick="loadProducts()">انصراف / بروزرسانی</button>
    </div>
  `;
  renderPreview();
}

function renderPreview(){
  const el=document.getElementById("preview");
  if(!el)return;
  if(!images.length){el.innerHTML='<div class="muted">هنوز عکسی انتخاب نشده است.</div>';return}
  el.innerHTML=images.map((src,i)=>`
    <div class="photo">
      <img src="${esc(src)}" alt="تصویر محصول">
      <button onclick="removeImage(${i})" title="حذف">×</button>
    </div>`).join("");
}

function removeImage(i){
  images.splice(i,1);
  renderPreview();
}

function readImages(event){
  const files=[...(event.target.files||[])];
  if(!files.length)return;
  let pending=files.length;
  files.forEach(file=>{
    if(!file.type.startsWith("image/")){pending--;return}
    const reader=new FileReader();
    reader.onload=()=>{images.push(reader.result);pending--;renderPreview()};
    reader.readAsDataURL(file);
  });
  event.target.value="";
}

function formData(){
  return {
    name:document.getElementById("f_name").value.trim(),
    category:document.getElementById("f_category").value.trim(),
    price:Number(document.getElementById("f_price").value)||0,
    old_price:Number(document.getElementById("f_old_price").value)||0,
    stock:Number(document.getElementById("f_stock").value)||0,
    brand:document.getElementById("f_brand").value.trim(),
    color:document.getElementById("f_color").value.trim(),
    dimensions:document.getElementById("f_dimensions").value.trim(),
    material:document.getElementById("f_material").value.trim(),
    weight:document.getElementById("f_weight").value.trim(),
    description:document.getElementById("f_description").value.trim(),
    images:images
  };
}

async function saveProduct(){
  const data=formData();
  if(!data.name){showStatus("نام محصول را وارد کن.",true);return}

  try{
    const isNew=selectedId===null;
    const url=isNew?API+"/api/products":API+"/api/products/"+selectedId;
    const r=await fetch(url,{
      method:isNew?"POST":"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    const result=await r.json();
    if(!result.success) throw new Error(result.message||"خطا در ذخیره محصول");

    showStatus(isNew?"محصول با موفقیت اضافه شد.":"تغییرات محصول با موفقیت ذخیره شد.");
    selectedId=isNew?result.id:selectedId;
    await loadProducts();
    if(selectedId) editProduct(selectedId);
  }catch(e){
    showStatus("خطا در ذخیره: "+e.message,true);
  }
}

async function deleteProduct(){
  if(!selectedId)return;
  const p=products.find(x=>Number(x.id)===Number(selectedId));
  if(!confirm("آیا از حذف «"+(p?.name||"این محصول")+"» مطمئنی؟"))return;

  try{
    const r=await fetch(API+"/api/products/"+selectedId,{method:"DELETE"});
    const result=await r.json();
    if(!result.success) throw new Error(result.message||"خطا در حذف");
    selectedId=null;
    images=[];
    showStatus("محصول با موفقیت حذف شد.");
    await loadProducts();
    document.getElementById("editor").innerHTML='<div class="empty">محصول حذف شد. محصول دیگری را انتخاب کنید.</div>';
  }catch(e){
    showStatus("خطا در حذف: "+e.message,true);
  }
}

loadProducts();
</script>
</body>
</html>
