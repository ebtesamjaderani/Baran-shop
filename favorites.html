<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>علاقه‌مندی‌ها | Baranplusss</title><link rel="stylesheet" href="style.css?v=20260909-3"></head><body>
<header class="site-header"><div class="header-main"><a class="logo" href="index.html"><img class="brand-logo" src="logo-baranplusss.jpg" alt="Baranplusss"><span class="logo-caption"><strong>Baranplusss</strong><small>لوازم خانه و آشپزخانه</small></span></a><div class="head-actions" style="margin-right:auto"><button class="cart" onclick="location.href='index.html'"><span>بازگشت به فروشگاه</span></button></div></div></header>
<main class="section"><div class="heading"><div><span>انتخاب‌های شما</span><h2>علاقه‌مندی‌ها</h2></div></div><div id="favoritesGrid" class="products"></div></main>
<script>
const API_URL='https://api.baranplusss.ir'; let products=[];let fav=JSON.parse(localStorage.getItem('baran_favorites')||'[]');const fa='۰۱۲۳۴۵۶۷۸۹';const num=v=>Number(String(v||'').replace(/[۰-۹]/g,d=>fa.indexOf(d)).replace(/[^0-9]/g,''))||0;const money=v=>num(v).toLocaleString('fa-IR');
function removeFav(i){fav=fav.filter(x=>x!==i);localStorage.setItem('baran_favorites',JSON.stringify(fav));render()}
function render(){const g=document.querySelector('#favoritesGrid');const arr=fav.map(i=>({p:products[i],i})).filter(x=>x.p);g.innerHTML=arr.length?arr.map(({p,i})=>{const src=p.images?.[0]||p.image;return `<article class="product"><div class="pic">${src?`<img src="${src}" alt="${p.name}">`:`<span class="pic-fallback">${p.emoji||'🛍️'}</span>`}</div><div class="product-body"><span class="product-cat">${p.cat||'خانه و آشپزخانه'}</span><h3>${p.name}</h3><div class="price">${money(p.price)} <small>تومان</small></div><button class="add" onclick="location.href='product.html?id=${i}'">مشاهده محصول</button><button class="remove-btn" onclick="removeFav(${i})">حذف از علاقه‌مندی‌ها</button></div></article>`}).join(''):'<div class="empty-products">هنوز محصولی به علاقه‌مندی‌ها اضافه نکرده‌اید.<br><a href="index.html#products">مشاهده محصولات</a></div>'}async function loadProducts(){try{const r=await fetch(API_URL+'/api/products');const d=await r.json();products=(d.products||[]).map(x=>({id:x.id,name:x.name||'',cat:x.category||'خانه و آشپزخانه',price:x.price||0,oldPrice:x.old_price||0,stock:Number(x.stock||0),images:Array.isArray(x.images)?x.images:(typeof x.images==='string'&&x.images?(()=>{try{return JSON.parse(x.images)}catch(e){return []}})():[])}));render()}catch(e){products=JSON.parse(localStorage.getItem('baran_products')||'[]');render()}} loadProducts();
</script></body></html>
